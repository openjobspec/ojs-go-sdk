name: API Compatibility

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apidiff:
    name: Go API Compatibility Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24.x'

      - name: Install apidiff
        env:
          GOWORK: "off"
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20250606033433-dcc06ee1d476

      - name: Determine comparable base
        id: base
        run: |
          set -euo pipefail
          BASE_REF="${{ github.event.pull_request.base.sha }}"
          git cat-file -e "${BASE_REF}^{commit}"
          echo "sha=${BASE_REF}" >> "$GITHUB_OUTPUT"

          if git cat-file -e "${BASE_REF}:go.mod"; then
            echo "comparable=true" >> "$GITHUB_OUTPUT"
          else
            echo "comparable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Base commit has no root go.mod; API comparison is not applicable"
          fi

      - name: Export current API
        if: steps.base.outputs.comparable == 'true'
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=readonly"
        run: |
          mkdir -p .api-compat
          apidiff -m -w .api-compat/new.api .

      - name: Export base API and compare
        if: steps.base.outputs.comparable == 'true'
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=readonly"
        run: |
          set -euo pipefail
          BASE_REF="${{ steps.base.outputs.sha }}"
          mkdir -p .api-compat/base
          git archive "$BASE_REF" | tar -x -C .api-compat/base
          (
            cd .api-compat/base
            apidiff -m -w ../old.api .
          )

          if ! CHANGES=$(apidiff -m .api-compat/old.api .api-compat/new.api 2>&1); then
            echo "::error::API comparison failed or found incompatible changes"
            echo "$CHANGES"
            exit 1
          fi

          if [ -n "$CHANGES" ]; then
            echo "$CHANGES"
          else
            echo "No API changes detected."
          fi
