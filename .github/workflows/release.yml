name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.24'

      - name: Validate Tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED_VERSION=$(python3 -c 'import re; print(re.search(r"^## \[([0-9]+\.[0-9]+\.[0-9]+)\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$", open("CHANGELOG.md").read(), re.MULTILINE).group(1))')
          echo "Releasing ${TAG}"
          if [ "$TAG" != "v${EXPECTED_VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package release v${EXPECTED_VERSION}"
            exit 1
          fi

      - name: Run Tests
        env:
          GOWORK: "off"
          GOFLAGS: "-mod=readonly"
        run: go test ./... -race -count=1

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p' || echo "")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV_TAG" ]; then
            {
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG}"
            } > release_notes.md
          else
            {
              echo "## Initial Release"
              echo ""
              echo "First release of the OJS Go SDK."
            } > release_notes.md
          fi
          {
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "go get github.com/openjobspec/ojs-go-sdk@${TAG}"
            echo '```'
          } >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
